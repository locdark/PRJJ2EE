server:
  port: 8080

spring:
  application:
    name: library-management-system
  profiles:
    active: dev

  datasource:
    url: jdbc:h2:mem:librarydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    schema:
      printer:
        enabled: true
    cors:
      allowed-origins: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"
      allowed-methods: "*"
      allowed-headers: "*"
      allow-credentials: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com
    password: your-app-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 2592000000 # 30 days
  vnpay:
    tmn-code: 2QXUI4B4
    hash-secret: AXYZBOPQRETUVWXKLMN1234567890ABC
    pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
    return-url: http://localhost:5173/payment-return
    api-url: https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
  sepay:
    account-number: ${SEPAY_ACCOUNT_NUMBER:49431072004}
    bank-code: ${SEPAY_BANK_CODE:TPBank}
    account-name: ${SEPAY_ACCOUNT_NAME:LE HOAI LOC}
    api-key: ${SEPAY_API_KEY:}
    qr-url: "https://qr.sepay.vn/img"
  mail:
    enabled: false # Set true when real SMTP credentials are provided, otherwise logs formatted email to console
  ai:
    gemini-api-key: ${GEMINI_API_KEY:}
